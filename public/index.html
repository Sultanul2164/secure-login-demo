<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login Demo</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 1.3rem; }
  input { display: block; width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  button { padding: 8px 16px; cursor: pointer; }
  .msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 0.9rem; white-space: pre-wrap; }
  .ok { background: #d4f8d4; color: #1a5d1a; }
  .err { background: #fbd4d4; color: #7a1a1a; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; }
  .tabs button.active { font-weight: bold; border: 2px solid #555; }
</style>
</head>
<body>
  <h1>Secure Login Demo</h1>
  <p>Login is protected with a device-bound session key, generated locally in your browser and never transmitted anywhere.</p>

  <div class="tabs">
    <button id="tabLogin" class="active">Login</button>
    <button id="tabRegister">Register</button>
  </div>

  <form id="loginForm">
    <input type="text" id="loginUser" placeholder="Username" required>
    <input type="password" id="loginPass" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>

  <form id="registerForm" style="display:none">
    <input type="text" id="regUser" placeholder="Choose a username" required>
    <input type="password" id="regPass" placeholder="Choose a password" required>
    <button type="submit">Register</button>
  </form>

  <div id="output" class="msg" style="display:none"></div>

  <script src="/js/crypto-session.js"></script>
  <script>
    const out = document.getElementById('output');
    function show(text, ok) {
      out.style.display = 'block';
      out.className = 'msg ' + (ok ? 'ok' : 'err');
      out.textContent = text;
    }

    document.getElementById('tabLogin').onclick = () => {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabRegister').classList.remove('active');
    };
    document.getElementById('tabRegister').onclick = () => {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
      document.getElementById('tabRegister').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
    };

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUser').value;
      const password = document.getElementById('regPass').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      show(res.ok ? 'Registered! Switch to Login.' : ('Error: ' + data.error), res.ok);
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;

      // Step 1: normal password login
      const loginRes = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const loginData = await loginRes.json();
      if (!loginRes.ok) {
        show('Login failed: ' + loginData.error, false);
        return;
      }

      // Step 2: generate a fresh, non-extractable key pair IN THIS BROWSER
      // and bind its public key to the new session by signing the
      // server's one-time challenge.
      const keyPair = await SecureSession.createAndStoreNewKeyPair();
      const publicKeyJwk = await SecureSession.exportPublicKeyJwk(keyPair.publicKey);
      const signature = await SecureSession.signString(keyPair.privateKey, loginData.challenge);

      const bindRes = await fetch('/api/bind-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ publicKeyJwk, signature })
      });
      const bindData = await bindRes.json();
      if (!bindRes.ok) {
        show('Key binding failed: ' + bindData.error, false);
        return;
      }

      show('Logged in and key-bound! Redirecting to dashboard...', true);
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
    });
  </script>
</body>
</html>
